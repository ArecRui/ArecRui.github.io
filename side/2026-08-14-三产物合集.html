# AI副业日报

**日期：** 2026年8月14日（周五）
**运营角色：** AI副业运营 Agent
**内容定位：** 英文优先 · 不真人出镜 · AI辅助制作 · 知识型 / 纪录片式 / 分析型
**核心方向：** AI时代，大众传播如何影响人的认知、行为和社会
**数据基础：** 基于本日真实网络检索（WebSearch，覆盖 2026-08-04 ~ 08-14 的 AI / 内容 / 传播学趋势），关键数据均标注来源与日期，避免使用未核实案例。昨日的强锚点数据（Sprout Social Q1 2026、Reuters DNR 2026、Nature Gauthier et al. 2026、Human Security 2026、YouTube 7/16 新政）继续有效并与之交叉验证。

---

## 一、今日市场机会

过去 7 天（2026-08-04 ~ 08-14）出现三条与你的"传播学 + 新媒体"优势高度重合的新主线：

1. **欧盟《AI法案》透明度条款已生效（8/2），"AI 必须自报身份"从伦理变成法律。** 所有对话类 AI 须主动表明身份；AI 生成的图片/视频/配音等深度伪造内容须嵌入可机器识别的水印；违规最高罚 750 万欧元或全球年营收 1%。谷歌、微软、OpenAI 等 180+ 企业签署配套自律准则，**唯独 Meta 拒绝加入**。这意味着"真实 vs AI"不再只是观众偏好，而是制度刚需——你的「媒体素养 / 真实媒体 / 披露合规」内容方向获得政策背书，且创作者急需"如何合规标注 AI"的方法论，直接形成咨询/课程需求。

2. **开源 AI 视频浪潮集中爆发，无脸纪录片成本坍塌。** 8 月内密集发布：LTX-2.5（8/11，开放权重"视频世界模型"，双 GB200 上 6.8 秒出 10 秒 720p、原生多镜头一致性、免费用于年经常性收入 <1000 万美元主体）、阿里 Wan3.0（8/6 公测，30 秒、首次支持 doc/xls/ppt/pdf/md 文档输入、强调真实感）、Sand.ai MAGI-2 Preview（8/5，全球首个千亿级 MoE 开源视频模型，114B 参数仅激活 6B）、FLUX 3 Video（8/4 正式可用，20 秒、原生音频、世界模型架构）、MiniMax H3（7/31 发布、8/3 开放权重，2K/15 秒原生立体声、Artificial Analysis 视频编辑 Elo 全球第一）。**"不真人出镜的知识 IP"首次在成本与可控性上同时可行**——这正是你路线的生产基础设施。

3. **"平台化"（platformisation）与信任危机同步深化，受众在问"到底该信谁"。** Reuters《2026 数字新闻报告》（6 月发布、持续发酵）确认：全球 **54%** 的人用社媒/视频网络获取新闻（史上首次成为主导模式）；新闻信任在 48 个市场中 29 个下跌、创 2015 年来新低；担心假新闻的比例升至 **62%**；全球新闻兴趣平均降 **13pp**；Google AI 搜索摘要使新闻网站自然流量降 **33%**（出版商预计三年减半）。当传统入口失效、受众迷茫，"用传播学透镜解释信息环境"的内容正是被需要的公共物品——你的差异化主场。

## 三、10 个视频选题

> 评分维度：海外潜力、搜索需求、系列性、AI 可制作度、传播学壁垒。商业潜力 1–10。前 5 个为今日新数据驱动，后 5 个为已验证的 evergreen 锚点。

**1. AI Must Now Say "I Am AI" — What the EU Law Means for Creators**
- 英文标题：AI Must Now Say "I Am AI" — What the EU Law Means for Creators
- 核心问题：当法律强制 AI 自报身份、深度伪造强制水印，内容创作者和受众分别意味着什么？
- 目标观众：全球创作者、品牌方、媒体素养受众
- 内容价值：把冷门法规翻译成"创作合规指南"，抢占"AI 披露"解释权
- 3 分钟结构：钩子（"你接的客服可能法律上必须说'我是 AI'"）→ 三条硬约束 → 给创作者的 3 条合规动作
- 10 分钟结构：8/2 生效背景 → 三类约束逐条拆解 → Meta 拒签的隐喻 → 拟剧理论（前台/后台信任）→ 创作者"披露即资产"策略
- 需要的数据和案例：EU AI Act 透明度条款（8/2 生效）；180+ 企业签署、Meta 拒签；YouTube 已要求 AI 披露
- 制作难度：3/10　商业潜力：8/10

**2. The Open-Source AI Video Wave Just Changed Everything**
- 英文标题：The Open-Source AI Video Wave Just Changed Everything
- 核心问题：一周内 5 个开源/开放权重视频模型发布，无脸纪录片制作逻辑变了吗？
- 目标观众：创作者、影视从业者、AI 关注者
- 内容价值：从"媒介可供性/叙事权"而非参数评测解读技术，建立技术×传播双视角
- 3 分钟结构：钩子（"这条视频，没人拍、也没人拥有版权壁垒"）→ 5 个模型 30 秒速览 → 一句话结论
- 10 分钟结构：视频生成演进 → LTX-2.5/Wan3.0/MAGI-2/FLUX 3/MiniMax H3 路线对比 → "长叙事+一致性"对信息生产的冲击 → 对媒体素养的新挑战（水印/可识别标识）
- 需要的数据和案例：LTX-2.5（8/11，6.8s/10s、多镜头一致）；Wan3.0（8/6，30s、文档输入）；MAGI-2（8/5，114B MoE）；FLUX 3 Video（8/4，原生音频）；MiniMax H3（开放权重、Elo 第一）
- 制作难度：4/10　商业潜力：9/10

**3. TikTok Isn't Killing Google — But "Answer Engines" Are**
- 英文标题：TikTok Isn't Killing Google — But "Answer Engines" Are
- 核心问题：搜索真的从谷歌迁走了吗？真正的变化是"答案引擎"崛起，这对内容策略意味着什么？
- 目标观众：创作者、SEO/营销人、泛知识观众
- 内容价值：纠正"TikTok 取代 Google"误读，提出 VSEO+AEO 双轨，直接影响你的标题/字幕/口播
- 3 分钟结构：钩子（"Z 世代更爱 TikTok 搜？数据说反了"）→ Adobe 关键数（49% 用 TikTok 搜、但仅 4% Z 世代更信它胜过 Google）→ ChatGPT 14% 反超趋势
- 10 分钟结构：Adobe Express 1/2026 全量数据 → 多平台搜索行为（TikTok/Google/Reddit/ChatGPT 分流）→ "答案引擎"如何改写引用逻辑 → 创作者的 VSEO+AEO 清单
- 需要的数据和案例：Adobe Express（1/2026，807 消费者+200 小企业）；Gen Z TikTok 偏好 8%→4%；ChatGPT 14% 更信；61% 搜教程/45% 评测/41% 故事
- 制作难度：3/10　商业潜力：8/10

**4. Why Your Feed Hides Real Journalism**
- 英文标题：Why Your Feed Hides Real Journalism
- 核心问题：为什么你在社媒上越来越少看到专业新闻，却越来越多看到"活动人士"？这是算法故意的。
- 目标观众：关心媒体、政治传播、算法的全球普通观众
- 内容价值：把平台权力与议程设置讲成纪录片，强专业权威
- 3 分钟结构：钩子（"不是你不爱看新闻，是算法不给你看"）→ CEPR 数据（新闻机构 -15.5pp）→ 一句反转（feed 在替你做编辑）
- 10 分钟结构：Gauthier et al. Nature 2026 实验 → CEPR/VoxEU 拆解（新闻 -15.5pp、活动者 +27.4%）→ "最小可见度标准"政策辩论 → 议程设置/把关人理论收尾
- 需要的数据和案例：Gauthier et al., Nature 2026；Guriev et al. / Campante et al., CEPR VoxEU 2026；Reuters DNR 2026（54% 社媒获取新闻）
- 制作难度：4/10　商业潜力：9/10

**5. The 60-Minute Window: How to Prebunk Misinformation**
- 英文标题：The 60-Minute Window: How to Prebunk Misinformation
- 核心问题：谣言在 80 分钟内完成半数曝光，普通人能在算法之前做点什么？
- 目标观众：学生、媒体素养教育者、泛科技观众
- 内容价值：给出"抢在算法前"的可操作清单，区别于空谈素养
- 3 分钟结构：钩子（"假新闻前 80 分钟你还有机会"）→ 剑桥研究（60 分钟内干预减 45–55%）→ 3 个 prebunking 动作
- 10 分钟结构： misinformation 半衰期（50% 曝光 <80 分钟）→ 三类早期工具（预先免疫/AI 检测标注/快速核查）→ 组合干预的 ODE 模型结论 → 个人媒体素养行动指南
- 需要的数据和案例：Cambridge（2026）早期干预建模；sqmagazine 2026（假新闻快 6 倍、触达 1500 人；算法排序驱动 60–70% 误传互动）；Doh Shin AI & Society 2026（四阶段扩散）
- 制作难度：中　商业潜力：8/10

**6. How the Feed Quietly Rewired Your Politics**
- 英文标题：How the Feed Quietly Rewired Your Politics
- 核心问题：一个推荐算法，真的能在 7 周内改变你对具体议题的看法吗？
- 目标观众：关心政治传播、算法、社会的全球普通观众
- 内容价值：把"算法态度极化"讲成惊悚纪录片，建立专业权威
- 3 分钟结构：钩子 → Nature 2026 X 实验结论 → 反转（feed 不是镜子，是旋钮）
- 10 分钟结构：实验设计（算法流 vs 时间流，7 周）→ 三大发现（态度右移/传统新闻降权/不可逆）→ 议程设置+使用与满足+媒介化政治
- 需要的数据和案例：Gauthier et al., Nature 2026；Guess et al. 2023；Piccardi et al. 2025 Science
- 制作难度：4/10　商业潜力：9/10

**7. Why 88% of People No Longer Trust News on Social Media**
- 英文标题：Why 88% of People No Longer Trust News on Social Media
- 核心问题：当社交媒体成了新闻头版，为什么我们反而更不信它？
- 目标观众：媒体素养爱好者、普通网民
- 内容价值：双数据源拆解信任崩塌，给"可信信号"清单
- 3 分钟结构：钩子 → 两组关键数据 → 3 个辨别技巧
- 10 分钟结构：社媒成首要新闻源 → 信任跌到 37% → AI slop 与虚假信息两大推手 → 媒介依赖+E-E-A-T
- 需要的数据和案例：Sprout Social Q1 2026 Pulse；Reuters DNR 2026（信任 37%/担忧 62%/AI 新闻信任 20%）
- 制作难度：3/10　商业潜力：9/10

**8. The Internet Is 74% AI-Written — And What "Model Collapse" Means**
- 英文标题：The Internet Is 74% AI-Written — And What "Model Collapse" Means
- 核心问题：当新网页 74% 由 AI 生成，信息质量会怎样退化？
- 目标观众：学生、媒体素养教育者、泛科技观众
- 内容价值：信息素养科普 + 模型崩溃机制，易传播、易成系列
- 3 分钟结构：74.2% 数据 → 模型崩溃（复印机比喻）→ 3 个日常辨别法
- 10 分钟结构：Human Security 2026-04-20 报告 → 训练数据墙 → Shumailov et al. Nature 2024（9 代崩溃）→ 个人媒体素养指南

### 理论（Theory）
- **议程设置 / 把关人理论**：X 算法用"降权新闻机构、提权活动者"替用户做编辑决策；引出"最小可见度标准"政策辩论。

- **使用与满足 + 搜索行为迁移**：用户因"短格式/故事性/个性化"转向 TikTok，因"直接答案"转向 ChatGPT——多平台分流。

- **媒介依赖 / 平台认知权力（PEI 框架）**：当传统入口（Google/新闻站）失效，受众依赖平台算法"解释世界"，平台认知权力上升。

## 六、商业化判断

- **当前距离商业化多远**：早期（0→1）。尚未发布稳定栏目；但方向正确——英文知识+无脸+传播学壁垒，且 YouTube 教育/学习类受平台倾斜（93% 的 18–24 岁用 YouTube 学习）。开源视频模型（LTX-2.5/Wan3.0 等）把制作成本再压一截，**内容爬坡的技术门槛更低了**。预计 3–6 个月内容积累建立信任。
- **当前最大商业机会**：① **知识产品/课程**——中英市场都稀缺"传播学 × AI 素养"体系化入门，EU AI Act 更催生"创作者 AI 披露合规"细分课；② **AI 内容咨询/企业培训**——品牌急需"如何不做成 slop + 如何合规标注"的方法论；③ **付费社群/Newsletter**——与"用户积累→信任→产品"路径一致；④ **AEO/答案引擎优化服务**——帮品牌/创作者被 ChatGPT 引用，是新蓝海。
- **当前最大风险**：① 1 小时/天约束下易因"完美主义"停滞（勿无限规划）；② 纯 AI 念稿无脸号若缺稳定人格声音，在 TikTok "真实感"权重下易低留存——须打磨 narrator 人设；③ 单平台依赖（应 YouTube/TikTok/X/Podcast 同步，中文 B站/小红书/知乎作回译补充）；④ 合规：EU AI Act 已生效，未来接品牌/赞助须明确披露（FTC、EU DSA、YouTube AI 标签），现在起养成标注习惯。

# Script — Why Your Feed Hides Real Journalism（10 分钟支柱视频）

> 状态：Agent 预建初稿（2026-08-14）。可直接进制作；数据制作前回原始出处二次核对。
> 定位：传播学纪录片式 / 英文无脸 / 旁白 narrator 人设。理论内核：议程设置 + 把关人 + 平台认知权力。
> 数据锚点：Gauthier et al. Nature 2026；Guriev/Campante CEPR VoxEU 2026；Reuters DNR 2026。

---

## 0. 元数据
- 英文标题：Why Your Feed Hides Real Journalism
- 时长目标：9–11 分钟
- 目标观众：关心媒体、算法、政治传播的全球普通观众（泛知识）
- 核心论点：不是你不爱看新闻，是推荐算法在替你做编辑——且它系统性地压低专业新闻、抬高情绪化内容。
- CTA：订阅 + 评论"你最近一次看到真新闻是在哪" + 引导到 Newsletter/资产库。

---

## 1. 钩子（0:00–0:45）
- 画面：黑屏 → 一行字「你以为你在刷新闻。其实有人在替你挑。」
- 旁白："打开手机，你看到的'新闻'是谁选的？不是编辑部，不是你——是一个算法。而最新研究发现，这个算法正悄悄把专业新闻从你眼前拿走。"
- 数据钩子："在 X 上，算法流让新闻机构的出现率比'时间顺序'低了 **15.5 个百分点**——下降了近六成。"

## 2. 设疑 + 个人化（0:45–2:00）
- 旁白："你可能觉得自己'信息很灵'。但想一想：上一次你看到一条来自专业记者的硬新闻，是在哪？还是说，你的信息流里全是转发、评论、和让你愤怒的短视频？"
- 桥接："今天我们用一项刚发表的田野实验，看清楚算法到底对你的信息环境做了什么。"

## 3. 核心研究一：Nature 2026 的 7 周实验（2:00–4:30）
- 旁白讲清实验设计：
  - 两组用户，一组看「算法推荐流」，一组看「时间顺序流」，持续 7 周。
  - 结果：算法流让用户的政策态度整体向右移动（更保守）；传统新闻媒体被系统性降权；且这种态度改变在切回时间流后**不可逆**。
- 画面：左右对比图（算法流 vs 时间流的信息构成）。
- 理论插入："这不是简单的'回音室'。回音室说算法强化你已有的偏好；但这项研究说——算法能**主动改变**你对具体议题的信念。feed 不是镜子，是旋钮。"

## 4. 核心研究二：CEPR/VoxEU 2026 的量化拆解（4:30–6:30）
- 旁白："具体怎么降权的？基于同一批数据的研究给出精确数字："
  - 新闻机构内容在算法流中出现率比时序流 **低 15.5pp（-58.1%）**。
  - 政治活动者（高频发政治内容的普通用户）内容 **高 5.9pp（+27.4%）**。
- 画面：两个箭头——新闻机构向下、活动者向上。
- 理论插入："这正是**议程设置**理论的当代版本：平台算法取代了传统编辑，决定什么'算新闻'。也是**把关人**理论的回归——只不过把关人现在是代码。"

## 5. 为什么这很重要：平台认知权力（6:30–8:00）
- 旁白："当 54% 的人已经用社媒和视频网络获取新闻（Reuters 2026），算法的这个选择就不再只是'产品体验'——它是在塑造一个社会的共同知识基底。"
- 画面：地球 + 信息流管道示意。
- 政策辩论："研究者据此提出'最小可见度标准'（minimum visibility）：像电视曾有的公共义务一样，平台是否该保证专业新闻的最低曝光？这是 2026 年最值得关注的政策问题之一。"
- 旁白："记住：打击假新闻，不只是删掉谎言——更是保证可信信息的**可见**。"

## 6. 反转 / 升华（8:00–9:30）
- 旁白："所以，下次你觉得'新闻都是烂的'，先问：你是真的看了新闻，还是只看了算法想让你看的？"
- 给观众 3 个动作：① 主动订阅/访问专业新闻源；② 用时间线/列表视图打破算法；③ 跨平台交叉验证（Google/Reddit/专业媒体）。
- 理论收尾："媒介素养，从来不是'不信任何事'，而是'知道谁在替你筛选'。"

## 7. CTA（9:30–结尾）
- "如果这条让你重新想了想自己的信息流，订阅——我会继续用传播学的透镜，拆算法怎么改变我们的认知。评论区告诉我：你最近一次看到真新闻，是在哪？"
- 引导 Newsletter / 资产库（埋 AEO 句式："the algorithm hides journalism from your feed" 便于 ChatGPT 引用）。

---

## 8. 制作备注（AI 辅助生产）
- 视觉：数据对比图、箭头动画、地球/管道示意——可用 LTX-2.5 / Wan3.0 / 可灵生成 B-roll，3Blue1Brown 式图表用静态 SVG/Manim 风格。
- 旁白：稳定 narrator 人设（有观点、不念稿感）；结尾 CTA 必须有人声温度。
- 合规：本片含对平台政策的讨论，非"敏感话题 AI 虚拟人"类，符合 YouTube 变现规则；若用 AI 生成人物口播新闻画面须加 AI 披露标签。
- AEO/SEO：标题与描述重复 "algorithm hides journalism / feed hides news"，便于被 TikTok 搜索与 ChatGPT 引用。

<script>
/* ---- 轻量 Markdown 渲染器（自包含，无需联网） ---- */
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function inlineMd(s){
  s = escapeHtml(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function parseTable(rows){
  // rows: array of raw " | a | b | " strings (header + separator + body)
  var header = rows[0].split('|').map(function(x){return x.trim();}).filter(function(x,i,arr){return !(i===0&&x==='')&&!(i===arr.length-1&&x==='');});
  var body = rows.slice(2).map(function(r){
    return r.split('|').map(function(x){return x.trim();}).filter(function(x,i,arr){return !(i===0&&x==='')&&!(i===arr.length-1&&x==='');});
  });
  var html = '<table><thead><tr>';
  header.forEach(function(h){ html += '<th>'+inlineMd(h)+'</th>'; });
  html += '</tr></thead><tbody>';
  body.forEach(function(cells){
    html += '<tr>';
    cells.forEach(function(c){ html += '<td>'+inlineMd(c)+'</td>'; });
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}
function renderMarkdown(md){
  var lines = md.replace(/\r\n/g,'\n').split('\n');
  var html = '', i = 0;
  while(i < lines.length){
    var line = lines[i];

    // horizontal rule
    if(/^---+$/.test(line.trim())){ html += '<hr>'; i++; continue; }

    // heading
    var h = line.match(/^(#{1,4})\s+(.*)$/);
    if(h){
      var lvl = h[1].length;
      html += '<h'+lvl+'>'+inlineMd(h[2])+'</h'+lvl+'>';
      i++; continue;
    }

    // blockquote (collect consecutive)
    if(/^>\s?/.test(line)){
      var q = [];
      while(i < lines.length && /^>\s?/.test(lines[i])){
        q.push(lines[i].replace(/^>\s?/,''));
        i++;
      }
      html += '<blockquote>'+inlineMd(q.join(' '))+'</blockquote>';
      continue;
    }

    // table (header line contains | and next line is separator)
    if(line.indexOf('|') !== -1 && i+1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]) && lines[i+1].indexOf('-') !== -1){
      var trows = [line, lines[i+1]];
      i += 2;
      while(i < lines.length && lines[i].indexOf('|') !== -1 && lines[i].trim() !== ''){
        trows.push(lines[i]); i++;
      }
      html += parseTable(trows);
      continue;
    }

    // unordered list (含缩进续行 / 嵌套)
    if(/^[-*]\s+/.test(line)){
      var ul = [];
      while(i < lines.length){
        var um = lines[i].match(/^[-*]\s+(.*)$/);
        if(um){ ul.push('<li>'+inlineMd(um[1])); i++;
          while(i<lines.length && /^\s+\S/.test(lines[i]) && !/^[-*]\s+/.test(lines[i].trim()) && !/^\d+\.\s+/.test(lines[i])){
            ul[ul.length-1] += '<br>'+inlineMd(lines[i].trim()); i++;
          }
          ul[ul.length-1] += '</li>';
        } else if(/^\s+[-*]\s+/.test(lines[i])){
          ul[ul.length-1] = ul[ul.length-1].replace(/<\/li>$/,'') + '<ul><li>'+inlineMd(lines[i].trim().replace(/^[-*]\s+/,''))+'</li></ul></li>';
          i++;
        } else break;
      }
      html += '<ul>'+ul.join('')+'</ul>';
      continue;
    }

    // ordered list (含缩进续行)
    if(/^\d+\.\s+/.test(line)){
      var ol = [];
      while(i < lines.length){
        var om = lines[i].match(/^\d+\.\s+(.*)$/);
        if(om){ ol.push('<li>'+inlineMd(om[1])); i++;
          while(i<lines.length && /^\s+\S/.test(lines[i]) && !/^\d+\.\s+/.test(lines[i]) && !/^[-*]\s+/.test(lines[i])){
            ol[ol.length-1] += '<br>'+inlineMd(lines[i].trim()); i++;
          }
          ol[ol.length-1] += '</li>';
        } else break;
      }
      html += '<ol>'+ol.join('')+'</ol>';
      continue;
    }

    // blank
    if(line.trim() === ''){ i++; continue; }

    // paragraph (collect until blank)
    var para = [];
    while(i < lines.length && lines[i].trim() !== '' && !/^(#{1,4})\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !/^[-*]\s+/.test(lines[i]) && !/^\d+\.\s+/.test(lines[i]) && !(lines[i].indexOf('|')!==-1)){
      para.push(lines[i]); i++;
    }
    if(para.length){
      html += '<p>'+inlineMd(para.join('<br>'))+'</p>';
    }
  }
  return html;
}

/* ---- 渲染三个产物 ---- */
['md1','md2','md3'].forEach(function(id){
  var el = document.getElementById(id);
  if(el){
    var panel = el.closest('.panel');
    var btn = panel.querySelector('.copybtn');
    // 把渲染结果插到 copybtn 之后
    var div = document.createElement('div');
    div.className = 'rendered';
    div.innerHTML = renderMarkdown(el.textContent);
    panel.insertBefore(div, btn.nextSibling);
  }
});

/* ---- Tabs ---- */
var tabs = document.querySelectorAll('.tab');
tabs.forEach(function(t){
  t.addEventListener('click', function(){
    tabs.forEach(function(x){x.classList.remove('active');});
    document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
    t.classList.add('active');
    document.getElementById(t.getAttribute('data-tab')).classList.add('active');
  });
});

/* ---- Copy ---- */
var toast = document.getElementById('toast');
document.querySelectorAll('.copybtn').forEach(function(b){
  b.addEventListener('click', function(){
    var panel = document.getElementById(b.getAttribute('data-copy'));
    var md = panel.querySelector('script[type="text/markdown"]');
    var text = md ? md.textContent : panel.innerText;
    navigator.clipboard.writeText(text).then(function(){
      toast.classList.add('show');
      setTimeout(function(){toast.classList.remove('show');}, 1400);
    });
  });
});
</script>
